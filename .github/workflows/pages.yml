name: Vial Web Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Check out custom Vial GUI
      uses: actions/checkout@v4

    - name: Check out pinned Vial Web runtime
      uses: actions/checkout@v4
      with:
        repository: vial-kb/vial-web
        ref: 3749f8dabc6d186f9b17cb75eed64e6bf0e23e16
        path: .vial-web

    - name: Check out this GUI inside the web build
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: .vial-web/vial-gui

    - name: Check out VIA keyboard definitions
      uses: actions/checkout@v4
      with:
        repository: vial-kb/via-keymap-precompiled
        ref: main
        path: .vial-web/via-keymap-precompiled

    - name: Cache Vial Web toolchain
      id: web-cache
      uses: actions/cache@v4
      with:
        path: |
          .vial-web/emsdk
          .vial-web/sources
          .vial-web/deps
        key: vial-web-ubuntu22-${{ hashFiles('.vial-web/version.sh', '.vial-web/patches/**') }}

    - name: Build Vial Web dependencies
      if: steps.web-cache.outputs.cache-hit != 'true'
      working-directory: .vial-web
      run: |
        ./fetch-emsdk.sh
        ./fetch-deps.sh
        ./build-deps.sh

    - name: Apply the modern browser shell
      working-directory: .vial-web
      env:
        REPOSITORY_URL: https://github.com/${{ github.repository }}
        GUI_VERSION: ${{ github.sha }}
      run: |
        python3 vial-gui/util/export_quantum_reference.py vial-gui/src/main/python/keycodes/keycodes.py vial-gui/web/quantum-data.js
        cp vial-gui/web/index.html src/index.html
        cp vial-gui/web/styles.css src/styles.css
        cp vial-gui/web/app.js src/app.js
        cp vial-gui/web/diagnostics.js src/diagnostics.js
        cp vial-gui/web/coi-serviceworker.js src/coi-serviceworker.js
        cp vial-gui/web/quantum.html src/quantum.html
        cp vial-gui/web/quantum.js src/quantum.js
        cp vial-gui/web/quantum-data.js src/quantum-data.js
        cp vial-gui/web/corne-icon.png src/icon.png
        sed -i "s|@REPOSITORY_URL@|${REPOSITORY_URL}|g" src/index.html
        sed -i "s|@VIAL_VER_SHORT@|${GUI_VERSION:0:7}|g" src/index.html
        sed -i "s|@WEB_VER_SHORT@|3749f8d|g" src/index.html

    - name: Build browser configurator
      working-directory: .vial-web/src
      run: |
        ./build.sh
        cp styles.css build/styles.css
        cp app.js build/app.js
        cp diagnostics.js build/diagnostics.js
        cp coi-serviceworker.js build/coi-serviceworker.js
        cp quantum.html build/quantum.html
        cp quantum.js build/quantum.js
        cp quantum-data.js build/quantum-data.js
        cp icon.png build/icon.png
        mkdir -p build/docs
        cp ../vial-gui/docs/corne-v4-vial.md build/docs/corne-v4-vial.md
        cp ../vial-gui/docs/quantum-keycodes.md build/docs/quantum-keycodes.md

    - uses: actions/configure-pages@v5

    - name: Upload browser configurator
      uses: actions/upload-pages-artifact@v3
      with:
        path: .vial-web/src/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build

    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
